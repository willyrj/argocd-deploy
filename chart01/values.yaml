# Per-namespace override of the `pod-security.kubernetes.io/enforce` label (default: baseline).
# hatchet -> privileged: the hatchet-stack chart (0.13.3) hardcodes `SYS_PTRACE` in its
# migration/seed/setup-job and worker-token Job containers (charts/hatchet-api/templates/
# setup-job.yaml) - not values-driven, so it cannot be avoided from the values file. baseline
# (and restricted) both reject non-default capabilities outright; only privileged allows it.
#
# assistantService (= ask71) -> privileged: the KMS chart's OpenSearch subchart
# (charts/11.knowledge-management-service, opensearch.sysctlInit.enabled) runs a PRIVILEGED
# init container to raise vm.max_map_count to 262144 (GKE nodes ship 65530; OpenSearch's
# bootstrap check hard-fails below 262144). baseline rejects privileged containers outright.
# Dev-only trade-off (decision 2026-08-18); the prod-grade alternative is setting the sysctl
# via linux_node_config on the GKE node pools (00-base) and disabling sysctlInit — that path
# recreates nodes, so it was deferred.
#
# Zitadel (charts/07.zitadel) needs NO override -> stays at the default `baseline`. The chart
# adds no privileged capabilities (no SYS_PTRACE, no hostPath, no hostNetwork) and runs as the
# container's non-root user, so `baseline` is sufficient.
namespacePodSecurity:
  hatchet: privileged
  assistantService: privileged

clusterSecretStore:
  enabled: true

