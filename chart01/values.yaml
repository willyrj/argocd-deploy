# core-service-secret (ns ask71): consumed via envFrom by the core-service API
# + 4 Hatchet workers (charts/10.core-service). Unlike assistantSecretKeys,
# this is a secretKey -> GSM-secret-id MAP because the GSM ids differ from the
# env-var keys: new core secrets are prefixed `core-service--` (the bare names
# were already claimed by assistant-service with different values), and four
# entries reuse pre-existing GSM secrets (shared postgres admin, core redis
# auth string, and the two manually-minted Zitadel tokens — note the
# singular-SERVICE GSM id feeding the plural-SERVICES env key).
# Source of truth: 02-ask/core-secretmanager-secrets.tf header.
coreServiceSecretMappings:
  DATABASE__PASSWORD: shared-postgres-admin-password
  REDIS__PASSWORD: core-redis-auth-string
  IAM_SERVICE__PAT: IAM_SERVICE__PAT
  APP__CORE_SERVICES_MACHINE_TOKEN: APP__CORE_SERVICE_MACHINE_TOKEN
  SECURITY__API_KEY_SALT: core-service--SECURITY__API_KEY_SALT
  SECURITY__MASTER_ENCRYPTION_KEY: core-service--SECURITY__MASTER_ENCRYPTION_KEY
  STORAGE__ACCOUNT_KEY: core-service--STORAGE__ACCOUNT_KEY
  NOTIFICATIONS__MAILCHIMP_API_KEY: core-service--NOTIFICATIONS__MAILCHIMP_API_KEY
  BILLING_METERING__AUTUMN_API_KEY: core-service--BILLING_METERING__AUTUMN_API_KEY
  BILLING_METERING__BILLING_HATCHET_CLIENT_TOKEN: core-service--BILLING_METERING__BILLING_HATCHET_CLIENT_TOKEN
  BILLING_METERING__SERVICE_API_KEY_SALT: core-service--BILLING_METERING__SERVICE_API_KEY_SALT
  BILLING_METERING__STRIPE_WEBHOOK_SECRET: core-service--BILLING_METERING__STRIPE_WEBHOOK_SECRET
  FOUNDRY__API_KEY: core-service--FOUNDRY__API_KEY
  SENTRY__DSN: core-service--SENTRY__DSN
  HATCHET__CLIENT_TOKEN: core-service--HATCHET__CLIENT_TOKEN

# knowledge-management-service-secret (ns ask71): consumed via envFrom by the
# KMS API + 3 Hatchet workers + Alembic migration Job (charts/11.knowledge-
# management-service), AND by the weaviate subchart pods (envSecrets pulls
# AUTHENTICATION_APIKEY_ALLOWED_KEYS from the same Secret). Same map shape as
# coreServiceSecretMappings: secretKey (env var) -> GSM secret id.
# Notes:
#   - VECTOR_DB__API_KEY and AUTHENTICATION_APIKEY_ALLOWED_KEYS intentionally
#     map to the SAME GSM secret (app client key == weaviate server allow-list).
#   - DATABASE__PASSWORD reuses km-postgres-admin-password (dedicated KM
#     Cloud SQL instance, admin user postgres).
#   - CORE_SERVICE__JWT_SECRET reuses the assistant-side GSM secret (cross-
#     service contract - must be byte-identical for all three services).
#   - APP__ENV is a literal injected via the ExternalSecret template (not GSM).
# Source of truth: 02-ask/km-secretmanager-secrets.tf header.
kmServiceSecretMappings:
  APP__MASTER_ENCRYPTION_KEY: knowledge-management-service--APP__MASTER_ENCRYPTION_KEY
  CORE_SERVICE__JWT_SECRET: assistant-service--CORE_SERVICE__JWT_SECRET
  DATABASE__PASSWORD: km-postgres-admin-password
  DOCUMENT_UNDERSTANDING__DI_SUBSCRIPTION_KEY: knowledge-management-service--DOCUMENT_UNDERSTANDING__DI_SUBSCRIPTION_KEY
  DOCUMENT_UNDERSTANDING__MODEL_CLIENT__API_KEY: knowledge-management-service--DOCUMENT_UNDERSTANDING__MODEL_CLIENT__API_KEY
  HATCHET__CLIENT_TOKEN: knowledge-management-service--HATCHET__CLIENT_TOKEN
  VECTOR_DB__API_KEY: knowledge-management-service--VECTOR_DB__API_KEY
  AUTHENTICATION_APIKEY_ALLOWED_KEYS: knowledge-management-service--VECTOR_DB__API_KEY
  STORAGE__S3__ACCESS_KEY_ID: knowledge-management-service--STORAGE__S3__ACCESS_KEY_ID
  STORAGE__S3__SECRET_ACCESS_KEY: knowledge-management-service--STORAGE__S3__SECRET_ACCESS_KEY

# frontend-secret (ns ask71): the ONLY genuinely-sensitive runtime values for the
# Next.js frontend (charts/12.frontend). Everything else it needs (service URLs,
# APP_ENV, feature flags, toggles) is non-secret and lives as plain `env:` entries
# in the frontend values file — the image reads all config at runtime via
# next-runtime-env, so one build serves every environment.
# The chart's Deployment has NO envFrom, so these are referenced individually as
# env[].valueFrom.secretKeyRef against this Secret.
# Source of truth: 02-ask/frontend-secretmanager-secrets.tf header.
frontendSecretMappings:
  AUTH_SECRET: frontend--AUTH_SECRET
  BILLING_API_KEY: frontend--BILLING_API_KEY

