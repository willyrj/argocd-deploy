apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-application01
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/willyrj/argocd-deploy.git
    #https://gitlab.com/nanuchi/argocd-app-config-git
    targetRevision: HEAD
    path: ./argo01
  destination:
    server: https://kubernetes.default.svc
    #namespace: argo01
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true      