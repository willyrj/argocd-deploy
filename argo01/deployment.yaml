apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo01
  namespace: argo-01
spec:
  selector:
    matchLabels:
      app: argo01
  replicas: 2
  template:
    metadata:
      labels:
        app: argo01
    spec:
      containers:
      - name: argo01
        image: nanajanashia/argocd-app:1.2
        ports:
        - containerPort: 8080

